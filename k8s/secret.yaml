apiVersion: v1
kind: Secret
metadata:
  name: pneumoscan-secrets
  namespace: pneumoscan
type: Opaque
# Values are base64-encoded. Generate with: echo -n "your_password" | base64
# IMPORTANT: Replace these with strong credentials before deploying to production.
data:
  # "changeme" → replace with: echo -n "YOUR_PASSWORD" | base64
  DB_PASSWORD: Y2hhbmdlbWU=
  # Same password used by the PostgreSQL container
  POSTGRES_PASSWORD: Y2hhbmdlbWU=
