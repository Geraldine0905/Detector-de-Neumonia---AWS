apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-pvc
  namespace: pneumoscan
spec:
  # ReadOnlyMany lets multiple ai-service pods mount the same volume concurrently.
  # Requires EFS CSI driver installed on the EKS cluster.
  # Install: https://docs.aws.amazon.com/eks/latest/userguide/efs-csi.html
  accessModes:
    - ReadOnlyMany
  storageClassName: efs-sc   # Created by the EFS CSI driver
  resources:
    requests:
      storage: 500Mi         # Model is ~113 MB; 500 Mi gives room for updates
