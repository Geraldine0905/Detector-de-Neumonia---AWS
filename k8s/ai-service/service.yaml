apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: pneumoscan
  labels:
    app: ai-service
spec:
  # ClusterIP — internal only, not reachable from outside the cluster
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
