apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: pneumoscan
  labels:
    app: db
spec:
  # ClusterIP — database is never exposed outside the cluster
  type: ClusterIP
  selector:
    app: db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
