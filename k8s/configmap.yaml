apiVersion: v1
kind: ConfigMap
metadata:
  name: pneumoscan-config
  namespace: pneumoscan
data:
  # Frontend → ai-service DNS (Kubernetes internal)
  AI_SERVICE_URL: "http://ai-service:8000"

  # Frontend/ai-service → PostgreSQL
  DB_HOST: "db-service"
  DB_PORT: "5432"
  DB_NAME: "neumonia"
  DB_USER: "neumonia_user"

  # ai-service model path (inside the mounted PVC)
  MODEL_PATH: "/app/models/conv_MLP_84.h5"

  # Gunicorn / Flask
  PYTHONUNBUFFERED: "1"
  TF_CPP_MIN_LOG_LEVEL: "2"
